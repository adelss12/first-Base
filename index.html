<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>الصفحة الرئيسية</title>
</head>
<body>
    <h1 id="welcome-text">جاري التحميل...</h1>
    <!-- بطاقة معلومات مدينة الرياض -->
    <div class="info-card">
        <h2>📍 مرحبًا بك في مدينة الرياض</h2>
        
        <!-- قسم الطقس -->
        <div class="weather-section">
            <span class="icon">☀️</span>
            <span class="temp">34°م</span>
            <p>الطقس اليوم: صافٍ ومشمس بوجه عام</p>
        </div>

        <hr> <!-- خط فاصل أنيق -->

        <!-- قسم مواقيت الصلاة -->
        <h3>🕋 مواقيت الصلاة لليوم:</h3>
        <ul class="prayer-list">
            <li><strong>الفجر:</strong> 04:45 ص</li>
            <li><strong>الظهر:</strong> 11:37 ص</li>
            <li><strong>العصر:</strong> 02:47 م</li>
            <li><strong>المغرب:</strong> 05:10 م</li>
            <li><strong>العشاء:</strong> 06:40 م</li>
        </ul>
    </div>
    <!-- محول العملات -->
<div class="currency-card">
    <h2>💱 محول العملات</h2>

    <input id="amount" type="number" placeholder="أدخل المبلغ" min="0">

    <select id="fromCurrency">
        <option value="SAR">ريال سعودي</option>
        <option value="USD">دولار أمريكي</option>
        <option value="EUR">يورو</option>
        <option value="AED">درهم إماراتي</option>
        <option value="GBP">جنيه إسترليني</option>
    </select>

    <select id="toCurrency">
        <option value="USD">دولار أمريكي</option>
        <option value="SAR">ريال سعودي</option>
        <option value="EUR">يورو</option>
        <option value="AED">درهم إماراتي</option>
        <option value="GBP">جنيه إسترليني</option>
    </select>

    <button id="convertButton">تحويل</button>

    <p id="conversionResult">ستظهر النتيجة هنا</p>
</div>
    <a href="https://google.com" target="_blank">انقر هنا لزيارة جوجل</a>

    <script src="app.js"></script>
</body>
</html>
